<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgLm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentLm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="scanlineLm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#00d2ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glowLm"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrongLm"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clipLm"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clipLm)">
    <rect width="900" height="200" rx="16" fill="url(#bgLm)"/>
    <rect width="900" height="200" rx="16" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.2"/>
    <g opacity="0.04">
      <line x1="0" y1="50" x2="900" y2="50" stroke="#00d2ff" stroke-width="1"/>
      <line x1="0" y1="100" x2="900" y2="100" stroke="#00d2ff" stroke-width="1"/>
      <line x1="0" y1="150" x2="900" y2="150" stroke="#00d2ff" stroke-width="1"/>
    </g>
    <rect x="0" y="0" width="900" height="200" fill="url(#scanlineLm)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(60,100)">
      <g filter="url(#glowLm)">
        <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#00d2ff" stroke-width="0.8" opacity="0.3">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#3a7bd5" stroke-width="0.6" opacity="0.2">
          <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="10s" repeatCount="indefinite"/>
        </ellipse>
        <circle r="3" fill="#00d2ff">
          <animateMotion dur="8s" repeatCount="indefinite">
            <mpath href="#orbit1lm"/>
          </animateMotion>
        </circle>
        <circle r="2.5" fill="#3a7bd5">
          <animateMotion dur="10s" repeatCount="indefinite">
            <mpath href="#orbit2lm"/>
          </animateMotion>
        </circle>
        <circle cx="0" cy="0" r="30" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0">
          <animate attributeName="r" values="25;50" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <g transform="scale(0.7)">
          <path d="M-15-5 C-15-15,-5-20,0-20 C5-20,15-15,15-5 C15-2,13 2,10 5 L15 15 L5 10 C2 12,-2 12,-5 10 L-15 15 L-10 5 C-13 2,-15-2,-15-5Z" fill="none" stroke="url(#accentLm)" stroke-width="2"/>
          <path d="M-8 0 L0-8 L8 0" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
        </g>
        <g opacity="0.5">
          <line x1="-35" y1="-30" x2="-20" y2="-30" stroke="#00d2ff" stroke-width="1">
            <animate attributeName="x1" values="-35;-20" dur="1.5s" repeatCount="indefinite"/>
          </line>
          <line x1="-35" y1="-25" x2="-15" y2="-25" stroke="#3a7bd5" stroke-width="0.8">
            <animate attributeName="x1" values="-35;-15" dur="1.2s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>
    </g>
    <path id="orbit1lm" d="M 60,100 m -60,0 a 60,22 0 1,0 120,0 a 60,22 0 1,0 -120,0" fill="none"/>
    <path id="orbit2lm" d="M 60,100 m -50,0 a 50,18 0 1,0 100,0 a 50,18 0 1,0 -100,0" fill="none"/>
    <g transform="translate(180,60)">
      <text x="0" y="0" font-family="monospace" font-size="42" font-weight="bold" fill="#00d2ff" filter="url(#glowStrongLm)">
        LogMind
        <animate attributeName="opacity" values="1;0.92;1" dur="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="0" font-family="monospace" font-size="42" font-weight="bold" fill="#00d2ff" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.06s" repeatCount="indefinite"/>
        LogMind
      </text>
      <text x="0" y="30" font-family="monospace" font-size="13" fill="#888" letter-spacing="3">LLM-POWERED SECURITY LOG ANALYZER</text>
      <text x="0" y="50" font-family="monospace" font-size="11" fill="#666" letter-spacing="1">SIGMA RULES · MITRE ATT&amp;CK · ANOMALY DETECTION</text>
    </g>
    <g transform="translate(780, 170)" opacity="0.35">
      <text font-family="monospace" font-size="9" fill="#00d2ff">LLM</text>
    </g>
  </g>
</svg>