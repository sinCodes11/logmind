title: Potential Web Shell Activity
id: a6c96c57-e9f1-5d1c-1e2c-7g9f0g1c3d4e
status: experimental
level: critical
description: Detects patterns indicating potential web shell execution or reverse shell activity
author: Daniel Gregg Jr
date: 2026/01/25
references:
  - https://attack.mitre.org/techniques/T1505/003/
tags:
  - attack.persistence
  - attack.t1505.003
  - attack.execution
logsource:
  product: linux
  category: process_creation
detection:
  selection_webshell:
    message|contains:
      - 'www-data'
      - 'apache'
      - 'nginx'
      - 'httpd'
    message|contains:
      - '/bin/bash'
      - '/bin/sh'
      - 'nc -e'
      - 'python -c'
      - 'perl -e'
      - 'ruby -rsocket'
  selection_reverse:
    message|contains:
      - 'bash -i'
      - '/dev/tcp/'
      - 'mkfifo'
      - 'telnet'
  condition: selection_webshell or selection_reverse
falsepositives:
  - Legitimate web application scripts
  - Automated maintenance tasks
